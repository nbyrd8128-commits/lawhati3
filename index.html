<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة رسم لا نهائية</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="لوحتي">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo&family=Tajawal&family=Almarai&family=Amiri&family=Reem+Kufi&family=Aref+Ruqaa&family=Lateef&family=El+Messiri&family=Changa&family=Lemonada&family=Marhey&family=Rakkas&family=Katibeh&family=Noto+Kufi+Arabic&family=Noto+Naskh+Arabic&family=Baloo+Bhaijaan+2&display=swap">
<style>
:root{--ui:#f4f4f5;--tx:#18181b;--ac:#4f46e5;--bd:#d4d4d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ui:#27272a;--tx:#fafafa;--ac:#818cf8;--bd:#52525b}}
:root[data-theme="dark"]{--ui:#27272a;--tx:#fafafa;--ac:#818cf8;--bd:#52525b}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--ui);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
textarea{-webkit-user-select:text;user-select:text}
#app{display:flex;flex-direction:column;height:100%}
#wrap{flex:1;position:relative;min-height:0;background:#fff;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#ti{position:absolute;margin:0;padding:0;background:transparent;outline:none;min-width:60px;resize:none;overflow:hidden;white-space:pre;line-height:1.2;z-index:2}
#bar{background:var(--ui);border-top:1px solid var(--bd);padding:4px 8px}
.row{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
button{flex:none;border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:10px;padding:5px 9px;font:inherit;font-size:13px;cursor:pointer;line-height:1.3}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
button.rec{background:#dc2626;color:#fff;border-color:#dc2626}
#sw,#np{display:flex;gap:6px}
#np[hidden]{display:none}
#sw button,#sc button,#np button{width:26px;height:26px;border-radius:50%;padding:0;border:2px solid var(--bd)}
#sw button.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
#sz{width:100px;flex:none;accent-color:var(--ac)}
#fn{flex:none;max-width:120px;font:inherit;font-size:13px;padding:4px;border:1px solid var(--bd);border-radius:10px;background:transparent;color:var(--tx)}
#fn option{color:#000}
#chip{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid var(--bd);vertical-align:-2px}
.pop{position:absolute;left:8px;right:8px;bottom:8px;z-index:4;background:var(--ui);border:1px solid var(--bd);border-radius:14px;padding:10px;box-shadow:0 4px 16px rgba(0,0,0,.3);max-height:72%;overflow:auto}
.pop[hidden]{display:none}
#pn{max-width:340px}
#pn canvas{position:static;display:block;width:100%;touch-action:none;border-radius:8px;margin-bottom:8px}
#svc{height:150px}#huc{height:22px}
.pr{display:flex;gap:8px;align-items:center;margin-bottom:8px}
#hx{width:84px;font:inherit;padding:4px;border:1px solid var(--bd);border-radius:8px;background:transparent;color:var(--tx)}
#col{width:40px;height:30px;padding:0;border:1px solid var(--bd);border-radius:8px;background:none}
#sc{display:flex;flex-wrap:wrap;gap:6px}
#bp{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
#bp[hidden]{display:none}
#bp button,.bgs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px;font-size:12px}
#bp canvas,.bgs canvas{width:100px;height:34px;border-radius:6px;display:block}
.bgs canvas{height:56px;width:90px}
.bgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px}
.pgs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.ph{font-size:12px;opacity:.7;margin:6px 0}
#ap{display:flex;gap:8px;flex-wrap:wrap}#ap[hidden]{display:none}
#sel{position:absolute;transform:translate(-50%,-100%);display:flex;gap:4px;background:var(--ui);border:1px solid var(--bd);border-radius:12px;padding:4px;z-index:3;box-shadow:0 2px 8px rgba(0,0,0,.3)}
#sel[hidden]{display:none}
#ts{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:6px 14px;border-radius:20px;font-size:13px;z-index:9}
#ts[hidden]{display:none}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
#modal[hidden]{display:none}
#mb{background:var(--ui);border-radius:14px;padding:12px;max-width:100%;max-height:100%;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
#mb img{max-width:100%;max-height:55vh;background:#fff;border-radius:8px}
#mb a{color:var(--ac)}
</style>
</head>
<body>
<div id="app">
 <div id="wrap">
  <canvas id="c"></canvas>
  <textarea id="ti" hidden rows="1" dir="ltr"></textarea>
  <div id="sel" hidden><button data-a="del">🗑</button><button data-a="col">🎨</button><button data-a="up">➕</button><button data-a="dn">➖</button><button data-a="dup">⧉</button><button data-a="fr">⬆</button></div>
  <div id="ts" hidden></div>
  <div id="pn" class="pop" hidden>
   <canvas id="svc" width="260" height="150"></canvas><canvas id="huc" width="260" height="22"></canvas>
   <div class="pr"><input id="hx" maxlength="7" dir="ltr"><input type="color" id="col" value="#1e1e1e"><button id="addc">➕ حفظ اللون</button></div>
   <div id="sc"></div>
  </div>
  <div id="bp" class="pop" hidden></div>
  <div id="pp" class="pop" hidden></div>
  <div id="ap" class="pop" hidden>
   <button data-f="image/*">🖼️ صورة</button><button data-f="video/*">🎬 فيديو</button><button data-f="audio/*">🎵 ملف صوتي</button><button data-f="*/*">📎 أي ملف</button>
  </div>
 </div>
 <div id="bar">
  <div class="row" id="tools"><button id="bb">🖌️ <span id="bn">قلم</span> ▾</button><button id="bl" title="قائمة نقطية">• نقاط</button><button id="add">➕ إضافة</button><button id="mic">🎙️ صوت</button></div>
  <div class="row">
   <button id="cp"><span id="chip"></span> لون</button><div id="sw"></div>
   <input type="range" id="sz" min="1" max="40" value="4">
   <select id="fn"></select><span id="np" hidden></span>
   <button id="pgb">📄 صفحة 1</button><button id="un">↩️</button><button id="re">↪️</button><button id="hm">🏠 <span id="zm">100%</span></button><button id="sv">💾 صورة</button><button id="cl">🗑️</button>
  </div>
 </div>
</div>
<input type="file" id="fi" multiple hidden>
<input type="file" id="fa" accept="audio/*" capture hidden>
<div id="modal" hidden><div id="mb"><div>اضغط مطولًا على الصورة لحفظها</div><img id="mi" alt=""><a id="ml" download="رسمتي.png">تحميل PNG</a><button id="mc">إغلاق</button></div></div>
<script>
const $=id=>document.getElementById(id);
const cv=$('c'),wrap=$('wrap'),ti=$('ti'),tb=$('tools');
let ctx=cv.getContext('2d'),W=0,H=0,dpr=window.devicePixelRatio||1,bk=1;
let view={x:0,y:0,k:1},tool='pen',color='#1e1e1e',size=4,items=[],cur=null,raf=0,hist=[[]],hi=0,sel=null,recol=false,curFont='Cairo',noteCol='#fff59d',bul=false,tp=null,drag=null,holdT=0,paper='#ffffff',rcT=0,svT=0,tsT=0;
const med={},playing=new Set(),mx=document.createElement('canvas').getContext('2d');
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const lum=h=>(parseInt(h.slice(1,3),16)*.3+parseInt(h.slice(3,5),16)*.59+parseInt(h.slice(5,7),16)*.11)/255;
function toast(m){const e=$('ts');e.textContent=m;e.hidden=false;clearTimeout(tsT);tsT=setTimeout(()=>e.hidden=true,2600)}

/* ---------- خلفيات الصفحات ---------- */
const BG=[['plain','أبيض سادة','#ffffff','#e5e7eb','plain'],['dots','نقاط','#ffffff','#cbd5e1','dots'],['grid','مربعات','#ffffff','#dbeafe','grid'],['lines','سطور','#fffef7','#bfdbfe','lines'],['graph','رسم هندسي','#f0f9ff','#93c5fd','graph'],['cream','ورق قديم','#f5ecd7','#d6c7a1','dots'],['pink','وردي ناعم','#fdf2f8','#fbcfe8','dots'],['black','سبورة سوداء','#111111','#3a3a3a','grid'],['green','سبورة خضراء','#1f4d3a','#3b7a60','dots'],['dark','ليلي','#1e1e2e','#45475a','dots']];
function bgDraw(x,w,h,i,v){const[,,c,l,t]=BG[i];x.fillStyle=c;x.fillRect(0,0,w,h);if(t==='plain')return;let st=40;while(st*v.k<14)st*=2;const s=st*v.k,ox=((v.x%s)+s)%s,oy=((v.y%s)+s)%s;x.fillStyle=l;x.strokeStyle=l;x.lineWidth=1;
 if(t==='dots'){for(let a=ox;a<w;a+=s)for(let b=oy;b<h;b+=s)x.fillRect(a-1,b-1,2,2);return}
 x.beginPath();if(t!=='lines')for(let a=ox;a<w;a+=s){x.moveTo(a+.5,0);x.lineTo(a+.5,h)}for(let b=oy;b<h;b+=s){x.moveTo(0,b+.5);x.lineTo(w,b+.5)}x.stroke();
 if(t==='graph'){x.lineWidth=1.6;x.beginPath();const S=s*5,a0=((v.x%S)+S)%S,b0=((v.y%S)+S)%S;for(let a=a0;a<w;a+=S){x.moveTo(a+.5,0);x.lineTo(a+.5,h)}for(let b=b0;b<h;b+=S){x.moveTo(0,b+.5);x.lineTo(w,b+.5)}x.stroke()}}

/* ---------- الصفحات والحفظ ---------- */
let P=[],pg=0;
(function(){let d=null;try{d=JSON.parse(lsGet('inf2'))}catch(e){}
 if(d&&d.P&&d.P.length){P=d.P.map(g=>({name:g.name,bg:g.bg||0,items:g.items||[],view:g.view,hist:[(g.items||[]).slice()],hi:0}));pg=Math.min(d.pg||0,P.length-1)}
 else{const g={name:'صفحة 1',bg:1,items:[],view:null,hist:[[]],hi:0};try{const o=JSON.parse(lsGet('inf-draw-v1'));if(o&&o.length){g.items=o;g.hist=[o.slice()]}}catch(e){}P=[g]}})();
function stash(){const g=P[pg];g.items=items;g.hist=hist;g.hi=hi;g.view=view}
function saveSoon(){clearTimeout(svT);svT=setTimeout(()=>{stash();lsSet('inf2',JSON.stringify({pg,P:P.map(g=>({name:g.name,bg:g.bg,items:g.items,view:g.view}))}))},500)}
function loadPage(i){pg=i;const g=P[i];items=g.items;hist=g.hist;hi=g.hi;view=g.view||{x:W/2,y:H/2,k:1};sel=null;recol=false;cur=null;paper=BG[g.bg][2];$('pgb').textContent='📄 '+g.name;draw()}
function switchPage(i){stash();loadPage(i);saveSoon()}
function setBG(i){P[pg].bg=i;paper=BG[i][2];const L=lum(paper);if(L<.4&&lum(color)<.35)setColor('#f5f5f5');else if(L>.6&&lum(color)>.8)setColor('#1e1e1e');saveSoon();draw()}
function commit(){hist=hist.slice(0,hi+1);hist.push(items.slice());hi++;if(hist.length>100){hist.shift();hi--}saveSoon()}
function undo(){commitText();if(hi>0){hi--;items=hist[hi].slice();sel=null;saveSoon();draw()}}
function redo(){if(hi<hist.length-1){hi++;items=hist[hi].slice();sel=null;saveSoon();draw()}}

/* ---------- الأدوات والفرش ---------- */
const B=[['pen','✏️','قلم'],['ballpoint','🖊️','جاف'],['ink','✒️','حبر'],['cal','🖋️','خط عريض'],['brushpen','🖌️','ريشة'],['pencil','📝','رصاص'],['marker','🖍️','ماركر'],['hl','🟨','هايلايتر'],['chalk','⬜','طباشير'],['crayon','🖍','تلوين'],['charcoal','⬛','فحم'],['watercolor','💧','مائي'],['oil','🎨','زيت'],['spray','💨','رش'],['air','☁️','ناعم'],['dots','⚫','نقاط'],['dashed','➖','متقطع'],['double','🟰','مزدوج'],['neon','💡','نيون'],['rainbow','🌈','قوس قزح'],['sparkle','✨','لمعان'],['stars','⭐','نجوم'],['hearts','❤️','قلوب'],['confetti','🎉','كونفيتي']];
const TL=[['eraser','🧽','ممحاة'],['text','🔤','نص'],['note','📒','ورقة'],['task','✅','مهام'],['sel','👆','تحديد'],['hand','✋','تحريك']];
TL.forEach(([id,ic,lb])=>{const b=document.createElement('button');b.textContent=ic+' '+lb;b.dataset.t=id;b.onclick=()=>{commitText();tool=id;mark()};tb.appendChild(b)});
tb.append($('bl'),$('add'),$('mic'));
function mark(){const br=!TL.some(t=>t[0]===tool);$('bb').classList.toggle('on',br);if(br)$('bn').textContent=(B.find(t=>t[0]===tool)||['','',''])[2];[...tb.children].forEach(b=>{if(b.dataset.t)b.classList.toggle('on',b.dataset.t===tool)});$('np').hidden=!(tool==='note'||tool==='task');cv.style.cursor=tool==='hand'?'grab':'crosshair';if(tool!=='sel'){sel=null;recol=false}draw()}
const PNL=['pp','bp','pn','ap'];
function pop(id){PNL.forEach(x=>{const e=$(x);e.hidden=x===id?!e.hidden:true});if($('pn').hidden)recol=false}

/* ---------- الألوان (منتقي حقيقي) ---------- */
let H_=0,S_=0,V_=.12;
function hsv2hex(h,s,v){const f=n=>{const k=(n+h/60)%6;return Math.round(255*(v-v*s*Math.max(0,Math.min(k,4-k,1))))};return'#'+[f(5),f(3),f(1)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function hex2hsv(x){const r=parseInt(x.slice(1,3),16)/255,g=parseInt(x.slice(3,5),16)/255,b=parseInt(x.slice(5,7),16)/255,m=Math.max(r,g,b),d=m-Math.min(r,g,b);let h=0;if(d){h=m===r?((g-b)/d+6)%6:m===g?(b-r)/d+2:(r-g)/d+4;h*=60}return[h,m?d/m:0,m]}
const svc=$('svc'),huc=$('huc'),sw=$('sw');
function drawPick(){const a=svc.getContext('2d'),w=svc.width,h=svc.height;a.fillStyle='hsl('+H_+',100%,50%)';a.fillRect(0,0,w,h);let g=a.createLinearGradient(0,0,w,0);g.addColorStop(0,'#fff');g.addColorStop(1,'rgba(255,255,255,0)');a.fillStyle=g;a.fillRect(0,0,w,h);g=a.createLinearGradient(0,0,0,h);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'#000');a.fillStyle=g;a.fillRect(0,0,w,h);
 a.strokeStyle='#fff';a.lineWidth=3;a.beginPath();a.arc(S_*w,(1-V_)*h,9,0,7);a.stroke();a.strokeStyle='#000';a.lineWidth=1;a.beginPath();a.arc(S_*w,(1-V_)*h,10.5,0,7);a.stroke();
 const b=huc.getContext('2d'),hw=huc.width,hh=huc.height;g=b.createLinearGradient(0,0,hw,0);for(let i=0;i<=6;i++)g.addColorStop(i/6,'hsl('+i*60+',100%,50%)');b.fillStyle=g;b.fillRect(0,0,hw,hh);b.fillStyle='#fff';b.strokeStyle='#000';b.lineWidth=2;b.beginPath();b.arc(Math.max(11,Math.min(hw-11,H_/360*hw)),hh/2,hh/2-1,0,7);b.fill();b.stroke()}
function pickBind(c,fn){const m=e=>{const r=c.getBoundingClientRect();fn(Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height)))};c.addEventListener('pointerdown',e=>{try{c.setPointerCapture(e.pointerId)}catch(_){}c._d=1;m(e)});c.addEventListener('pointermove',e=>{if(c._d)m(e)});c.addEventListener('pointerup',()=>c._d=0);c.addEventListener('pointercancel',()=>c._d=0)}
pickBind(svc,(x,y)=>{S_=x;V_=1-y;setColor(hsv2hex(H_,S_,V_),1)});
pickBind(huc,x=>{H_=x*360;setColor(hsv2hex(H_,S_,V_),1)});
function setColor(c,keep){color=c;if(!keep){const a=hex2hsv(c);if(a[1]>0&&a[2]>0)H_=a[0];S_=a[1];V_=a[2]}
 $('chip').style.background=c;$('hx').value=c;$('col').value=c;drawPick();[...sw.children].forEach(b=>b.classList.toggle('on',b.dataset.c===c));
 if(tp&&tp.kind==='t'){tp.c=c;ti.style.color=c}
 if(recol&&sel!=null&&items[sel]&&items[sel].c!==undefined){items[sel]={...items[sel],c};draw();clearTimeout(rcT);rcT=setTimeout(commit,500)}}
['#1e1e1e','#ffffff','#e11d48','#f97316','#eab308','#22c55e','#0ea5e9','#4f46e5','#a855f7','#78350f'].forEach(c=>{const b=document.createElement('button');b.style.background=c;b.dataset.c=c;b.onclick=()=>setColor(c);sw.appendChild(b)});
$('col').oninput=e=>setColor(e.target.value);
$('hx').oninput=e=>{let v=e.target.value.trim();if(v[0]!=='#')v='#'+v;if(/^#[0-9a-f]{6}$/i.test(v))setColor(v.toLowerCase())};
let saved=[];try{saved=JSON.parse(lsGet('inf-colors'))||[]}catch(e){}
function renderSaved(){const box=$('sc');box.innerHTML='';saved.forEach(c=>{const b=document.createElement('button');b.style.background=c;b.onclick=()=>setColor(c);box.appendChild(b)})}
$('addc').onclick=()=>{if(!saved.includes(color)){saved.unshift(color);saved=saved.slice(0,20);lsSet('inf-colors',JSON.stringify(saved));renderSaved()}};
renderSaved();
$('cp').onclick=()=>pop('pn');
$('sz').oninput=e=>size=+e.target.value;
$('bl').onclick=function(){commitText();bul=!bul;this.classList.toggle('on',bul);tool='text';mark()};
setColor(color);

/* ---------- رسم الفرش ---------- */
const rn=a=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const tpr=(i,n,m)=>n<3?1:Math.max(.15,Math.min(1,(i+1)/m,(n-i)/m));
function line(p){ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);if(p.length==1)ctx.lineTo(p[0][0]+.01,p[0][1]);for(let i=1;i<p.length-1;i++)ctx.quadraticCurveTo(p[i][0],p[i][1],(p[i][0]+p[i+1][0])/2,(p[i][1]+p[i+1][1])/2);if(p.length>1)ctx.lineTo(p[p.length-1][0],p[p.length-1][1]);ctx.stroke()}
function smooth(p,wf){const n=p.length;if(n==1)return[[p[0][0],p[0][1],wf(0)]];let ax=p[0][0],ay=p[0][1];const o=[[ax,ay,wf(0)]];
 for(let i=1;i<n;i++){const nx=p[i+1]||p[i],ex=(p[i][0]+nx[0])/2,ey=(p[i][1]+nx[1])/2,w0=o[o.length-1][2],w1=wf(i);for(let t=1;t<=3;t++){const u=t/3,a=(1-u)*(1-u),b=2*(1-u)*u,c=u*u;o.push([a*ax+b*p[i][0]+c*ex,a*ay+b*p[i][1]+c*ey,w0+(w1-w0)*u])}ax=ex;ay=ey}return o}
function ribbon(q){const n=q.length;if(n==1){ctx.beginPath();ctx.arc(q[0][0],q[0][1],Math.max(.3,q[0][2]/2),0,7);ctx.fill();return}
 const A=[],Bb=[];let t0=0,t1=0,r0=0,r1=0;
 for(let i=0;i<n;i++){const a=q[Math.max(0,i-1)],b=q[Math.min(n-1,i+1)];let dx=b[0]-a[0],dy=b[1]-a[1];const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;const r=Math.max(.15,q[i][2]/2),nx=-dy*r,ny=dx*r;A.push([q[i][0]+nx,q[i][1]+ny]);Bb.push([q[i][0]-nx,q[i][1]-ny]);if(i==0){t0=Math.atan2(ny,nx);r0=r}if(i==n-1){t1=Math.atan2(ny,nx);r1=r}}
 ctx.beginPath();ctx.moveTo(A[0][0],A[0][1]);for(let i=1;i<n;i++)ctx.lineTo(A[i][0],A[i][1]);
 for(let k=1;k<8;k++){const t=t1-Math.PI*k/8;ctx.lineTo(q[n-1][0]+Math.cos(t)*r1,q[n-1][1]+Math.sin(t)*r1)}
